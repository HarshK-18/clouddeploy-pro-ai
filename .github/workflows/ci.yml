
name: CloudDeploy Pro AI CI       #Name displayed in the GitHub Actions tab.

on:                               #Events that trigger the workflow.
  push:                           #Code pushed to main
    branches: [main]
  pull_request:                   #Runs when pull request targets main
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:                             #Defines work that GitHub runs
  validate:
    name: Lint and test
    runs-on: ubuntu-latest        #Uses a GitHub-hosted Linux runner.

    steps:                        #Commands excecute in order
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check src tests

      - name: Audit application dependencies
        run: pip-audit -r requirements.txt

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Validate configuration
        run: python validation/check_config.py

      - name: Run pytest
        run: python -m pytest -v
        

  aws_oidc_verify:
    name: Verify AWS OIDC authentication
    runs-on: ubuntu-latest
    needs: validate

    # Only authenticate on a push to the protected target branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2
          role-session-name: CloudDeployProAIOIDCVerify

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  deploy:
    name: Deploy CloudDeploy Pro AI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - aws_oidc_verify
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.170.0

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name CloudDeployProAI \
            --region ap-southeast-2 \
            --s3-bucket clouddeploy-pro-ai-artifacts-272310879145-ap-southeast-2 \
            --role-arn arn:aws:iam::272310879145:role/CloudDeployProAICloudFormationRole \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset