
name: CloudDeploy Pro AI CI       # Name displayed in the GitHub Actions tab.

on:                               # Events that trigger the workflow.
  push:                           # Runs when code is pushed to main.
    branches: [main]
  pull_request:                   # Runs when a pull request targets main.
    branches: [main]
  workflow_dispatch:              # Allows manual workflow execution from GitHub Actions.

permissions:                      # Default permissions for all jobs.
  contents: read                  # Allows jobs to read repository contents.

jobs:                             # Defines work that GitHub runs.

  validate:
    name: Lint and test
    runs-on: ubuntu-latest        # Uses a GitHub-hosted Linux runner.

    steps:                        # Commands execute in order.
      - name: Check out repository
        uses: actions/checkout@v6 # Downloads the repository code.
        with:
          fetch-depth: 0 # Fetches full Git history for Gitleaks scanning.

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2 # Checks for exposed secrets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6 # Installs Python on the runner.
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check . # Checks Python code quality across the project.

      - name: Audit application dependencies
        run: pip-audit -r requirements.txt # Checks application vulnerabilities.

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt # Checks development vulnerabilities.

      - name: Validate configuration
        run: python validation/check_config.py # Validates project configuration.

      - name: Run pytest
        run: python -m pytest -v # Runs unit tests.

  aws_oidc_verify:
    name: Verify AWS OIDC authentication
    runs-on: ubuntu-latest
    needs: validate             # Runs only after validation succeeds.

    # Verify AWS authentication on pushes to main and manual runs on main.
    # Skip OIDC verification for pull requests.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write            # Allows GitHub Actions to request an OIDC token.

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2
          role-session-name: CloudDeployProAIOIDCVerify

      - name: Verify AWS identity
        run: aws sts get-caller-identity # Confirms the assumed AWS identity.

  deploy:
    name: Deploy CloudDeploy Pro AI
    runs-on: ubuntu-latest

    # Deploy only when manually triggered on main.
    # Both validation and OIDC verification must succeed.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - aws_oidc_verify

    permissions:
      contents: read
      id-token: write            # Allows this job to authenticate using OIDC.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6 # Downloads source code.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2
          role-session-name: CloudDeployProAIDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity # Confirms AWS authentication.

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.170.0

      - name: Build SAM application
        run: sam build # Prepares the Lambda application.

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name CloudDeployProAI \
            --region ap-southeast-2 \
            --s3-bucket clouddeploy-pro-ai-artifacts-272310879145-ap-southeast-2 \
            --role-arn arn:aws:iam::272310879145:role/CloudDeployProAICloudFormationRole \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  notify_failure:
    name: Notify on CI/CD failure
    runs-on: ubuntu-latest

    # Always evaluate after dependencies finish.
    # Send notifications only for failed jobs on main.
    if: >-
      always() &&
      contains(needs.*.result, 'failure') &&
      github.ref == 'refs/heads/main'

    needs:
      - validate
      - aws_oidc_verify
      - deploy

    permissions:
      contents: read
      id-token: write            # Allows the notification job to authenticate using OIDC.

    steps:
      - name: Check out repository for failure analysis
        uses: actions/checkout@v6 # Downloads code and the labelled dataset.

      - name: Set up Python for failure analysis
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Generate advisory ML diagnosis
        id: diagnosis
        continue-on-error: true
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          OIDC_RESULT: ${{ needs.aws_oidc_verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          category = "unknown"
          advice = (
              "Automated diagnosis is unavailable. "
              "Review the workflow logs and troubleshoot manually."
          )

          try:
              # Install application dependencies on this separate runner.
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "-r",
                      "requirements.txt",
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              # The model artifact is git-ignored, so train it on this runner.
              subprocess.run(
                  [sys.executable, "src/failure_classifier.py"],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              from ai.analyze_failure import analyze_failure

              # Classify a bounded job-result summary, not raw workflow logs.
              message = (
                  f"Validation job: {os.getenv('VALIDATE_RESULT', 'unknown')}; "
                  f"AWS OIDC job: {os.getenv('OIDC_RESULT', 'unknown')}; "
                  f"Deployment job: {os.getenv('DEPLOY_RESULT', 'unknown')}"
              )

              result = analyze_failure(message)
              category = result.get("category", "unknown")
              advice = result.get(
                  "advice",
                  "Review the workflow logs and troubleshoot manually.",
              )

          except Exception:
              # ML must never prevent the notification from being attempted.
              category = "unknown"
              advice = (
                  "Automated diagnosis is unavailable. "
                  "Review the workflow logs and troubleshoot manually."
              )

          # Use single-line outputs for GitHub Actions.
          category = str(category).replace("\r", " ").replace("\n", " ")
          advice = str(advice).replace("\r", " ").replace("\n", " ")

          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as output:
              output.write(f"category={category}\n")
              output.write(f"advice={advice}\n")
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2
          role-session-name: CloudDeployProAINotification

      - name: Send failure notification through SNS
        env:
          AWS_REGION: ap-southeast-2
          SNS_TOPIC_ARN: arn:aws:sns:ap-southeast-2:272310879145:CloudDeployProAI-Notifications
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          OIDC_RESULT: ${{ needs.aws_oidc_verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ML_CATEGORY: ${{ steps.diagnosis.outputs.category || 'unknown' }}
          ML_ADVICE: ${{ steps.diagnosis.outputs.advice || 'Automated diagnosis is unavailable. Review the workflow logs manually.' }}
        run: |
          MESSAGE=$(cat <<EOF
          CloudDeploy Pro AI CI/CD failure detected.

          Repository: ${REPOSITORY}
          Workflow: ${WORKFLOW_NAME}
          Branch: ${BRANCH_NAME}
          Commit: ${COMMIT_SHA}

          Validation job: ${VALIDATE_RESULT}
          AWS OIDC job: ${OIDC_RESULT}
          Deployment job: ${DEPLOY_RESULT}

          ML diagnosis category: ${ML_CATEGORY}
          Suggested troubleshooting: ${ML_ADVICE}

          View workflow logs:
          https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          )

          aws sns publish \
            --region "${AWS_REGION}" \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "CloudDeploy Pro AI: CI/CD failure" \
            --message "${MESSAGE}"

          echo "Failure notification published to SNS."
