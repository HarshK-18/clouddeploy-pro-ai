
name: Temporary SNS Failure Alert Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate_failure:
    name: Simulate a controlled failure
    runs-on: ubuntu-latest

    steps:
      - name: Simulate validation failure
        run: |
          echo "Testing the SNS failure notification."
          echo "This failure is intentional and does not affect main CI."
          exit 1

  notify_sns:
    name: Send test failure notification
    runs-on: ubuntu-latest
    needs: simulate_failure

    # Run this job even though the preceding job intentionally failed.
    if: always() && needs.simulate_failure.result == 'failure'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272310879145:role/CloudDeployProAIGitHubActionsRole
          aws-region: ap-southeast-2
          role-session-name: CloudDeployProAISNSTest

      - name: Publish test failure notification
        env:
          SNS_TOPIC_ARN: arn:aws:sns:ap-southeast-2:272310879145:CloudDeployProAI-Notifications
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          MESSAGE=$(cat <<EOF
          CloudDeploy Pro AI - SNS Failure Alert Test

          This is an intentional test notification.
          The simulated job failure was expected.

          Repository: ${REPOSITORY}
          Branch: ${BRANCH_NAME}
          Simulated job result: failure

          Workflow run:
          https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}

          If you received this email, SNS email delivery is working.
          EOF
          )

          aws sns publish \
            --region ap-southeast-2 \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "CloudDeploy Pro AI - SNS Test Alert" \
            --message "${MESSAGE}"

          echo "SNS test notification published successfully."
