# - APP_ENV=development.


AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudDeploy Pro AI - minimal Lambda deployment foundation

Resources:
  CloudDeployProAILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/CloudDeployProAIHandler
      RetentionInDays: 7

  CloudDeployProAIHandler:
    Type: AWS::Serverless::Function
    DependsOn: CloudDeployProAILogGroup
    Properties:
      FunctionName: CloudDeployProAIHandler
      CodeUri: .
      Handler: src.app.handler
      Runtime: python3.14
      MemorySize: 128
      Timeout: 3
      Role: arn:aws:iam::272310879145:role/CloudDeployProAILambdaExecutionRole
      Environment:
        Variables:
          APP_ENV: development

Outputs:
  LambdaFunctionName:
    Description: Deployed Lambda function name
    Value: !Ref CloudDeployProAIHandler
  LambdaLogGroupName:
    Description: CloudWatch log group with seven-day retention
    Value: !Ref CloudDeployProAILogGroup
